root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/skarbnyk ./cmd/skarbnyk"
entrypoint = ["./tmp/skarbnyk"]
include_ext = ["go", "html", "css", "sql"]
exclude_dir = ["tmp", "vendor", ".git", ".idea"]
exclude_regex = ["_test\\.go"]
send_interrupt = true
kill_delay = "2s"
stop_on_error = true

[misc]
clean_on_exit = true
startup_banner = ""
