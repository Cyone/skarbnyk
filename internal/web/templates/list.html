{{define "list"}}
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скарбник</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand-row">
        {{template "mark"}}
        <h1>Скарбник</h1>
      </div>
      <p>Хто сидить на скарбі в державних торгах. Лоти Prozorro.Продажі проти ринку AUTO.RIA / DIM.RIA.</p>
    </div>
  </header>
  <main>
    <form class="filters" hx-get="/" hx-target="#results" hx-swap="outerHTML" hx-push-url="true" hx-include="#per-page">
      <label>Тип
        <select name="type">
          <option value="">усі</option>
          <option value="car" {{if eq .Filter.Kind "car"}}selected{{end}}>авто</option>
          <option value="apt" {{if eq .Filter.Kind "apt"}}selected{{end}}>квартири</option>
        </select>
      </label>
      <label class="suggest">Місто
        <input name="city" id="city" autocomplete="off" value="{{.Filter.City}}">
        <ul class="suggest-list" hidden>
          {{range .Cities}}<li>{{.}}</li>{{end}}
        </ul>
      </label>
      <label class="suggest">Організатор
        <input name="entity" id="entity" autocomplete="off" value="{{.Filter.Entity}}">
        <ul class="suggest-list" hidden>
          {{range .Entities}}<li>{{.}}</li>{{end}}
        </ul>
      </label>
      <label>Мін. знижка
        <input name="min" type="number" step="0.05" min="0" max="1" value="{{if .Filter.MinDiscount}}{{.Filter.MinDiscount}}{{end}}">
      </label>
      <label>Захід
        <select name="family">
          <option value="">усі</option>
          <option value="english" {{if eq .Filter.Family "english"}}selected{{end}}>англійський</option>
          <option value="dutch" {{if eq .Filter.Family "dutch"}}selected{{end}}>голландський</option>
        </select>
      </label>
      <label>Прохід
        <select name="pass">
          <option value="">усі</option>
          {{range .Passes}}<option value="{{.}}" {{if eq $.Filter.Pass .}}selected{{end}}>{{.}}</option>{{end}}
        </select>
      </label>
      <button type="submit">Шукати</button>
    </form>
    {{template "results" .}}
  </main>
  <footer>
    <div class="wrap">
      Дані торгів — <a href="https://prozorro.sale/">Prozorro.Продажі</a>.
      Ринкові ціни — <a href="https://auto.ria.com/">AUTO.RIA</a> та <a href="https://dom.ria.com/">DIM.RIA</a>.
    </div>
  </footer>
  <script>
  (function () {
    document.querySelectorAll(".suggest").forEach(function (wrap) {
      var input = wrap.querySelector("input");
      var box = wrap.querySelector("ul");
      if (!input || !box) return;
      var items = box.querySelectorAll("li");
      function close() { box.hidden = true; }
      function filter() {
        var q = input.value.trim().toLowerCase(), n = 0;
        for (var i = 0; i < items.length; i++) {
          var on = q && items[i].textContent.toLowerCase().indexOf(q) !== -1;
          items[i].hidden = !on;
          if (on) n++;
        }
        box.hidden = n === 0;
      }
      input.addEventListener("input", filter);
      input.addEventListener("focus", filter);
      box.addEventListener("mousedown", function (e) {
        var li = e.target.closest("li");
        if (!li || li.hidden) return;
        e.preventDefault();
        input.value = li.textContent;
        close();
      });
      document.addEventListener("click", function (e) {
        if (!wrap.contains(e.target)) close();
      });
    });
  })();
  </script>
</body>
</html>
{{end}}
